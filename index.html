<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vervoer App - Haal & Breng</title>
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f9;
        }
        #form-container {
            padding: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-secondary {
            padding: 10px 14px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background-color: #138496;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
            font-style: italic;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="form-container">
        <h2>Vervoer Opdracht</h2>
        
        <div class="input-group">
            <label for="haalAdres">Haaladres:</label>
            <div class="input-row">
                <input type="text" id="haalAdres" placeholder="Bijv. Dorpsstraat 1, Amsterdam">
                <button type="button" id="getLocatieBtn" class="btn-secondary">📍 Vul mijn stad in</button>
            </div>
        </div>

        <div class="input-group">
            <label for="brengAdres">Brengadres:</label>
            <input type="text" id="brengAdres" placeholder="Bijv. Kerkstraat 5, Utrecht">
        </div>

        <button id="startBtn" class="btn-primary">▶ Start Rit & Toon Kaart</button>
        <div id="status"></div>
    </div>

    <!-- De Kaart -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialiseer de kaart (standaard op Nederland gericht)
        let map = L.map('map').setView([52.1326, 5.2913], 8);

        // Voeg OpenStreetMap tegels toe
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // Geocoding: Adres naar GPS-coördinaten
        async function getCoordinates(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon)
                    };
                }
                return null;
            } catch (error) {
                console.error("Fout bij ophalen adres:", error);
                return null;
            }
        }

        // Reverse Geocoding: GPS-coördinaten naar Plaatsnaam/Adres
        async function getCityFromCoords(lat, lon) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data && data.address) {
                    // Pak de stad, het dorp of de gemeente
                    const city = data.address.city || data.address.town || data.address.village || data.address.municipality || data.display_name;
                    return city;
                }
                return null;
            } catch (error) {
                console.error("Fout bij ophalen plaatsnaam:", error);
                return null;
            }
        }

        // Knop 1: Vul huidige stad/locatie in bij Haaladres
        document.getElementById('getLocatieBtn').addEventListener('click', function() {
            const statusEl = document.getElementById('status');
            if (!navigator.geolocation) {
                alert("Geolocatie wordt niet ondersteund door deze browser.");
                return;
            }

            statusEl.textContent = "Huidige locatie ophalen...";
            navigator.geolocation.getCurrentPosition(async function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                const city = await getCityFromCoords(lat, lon);
                if (city) {
                    document.getElementById('haalAdres').value = city;
                    statusEl.textContent = "Stad/locatie gevonden en ingevuld!";
                } else {
                    statusEl.textContent = "Kon geen plaatsnaam vinden voor deze locatie.";
                }
            }, function(error) {
                statusEl.textContent = "Kan locatie niet ophalen. Controleer je toestemmingen.";
            });
        });

        // Knop 2: Start Rit & Toon Kaart
        document.getElementById('startBtn').addEventListener('click', async function() {
            const haal = document.getElementById('haalAdres').value;
            const breng = document.getElementById('brengAdres').value;
            const statusEl = document.getElementById('status');

            if (!haal || !breng) {
                alert("Vul alstublieft zowel het haal- als brengadres in.");
                return;
            }

            statusEl.textContent = "Adressen worden verwerkt en op de kaart geplaatst...";
            markersLayer.clearLayers();

            const haalCoords = await getCoordinates(haal);
            const brengCoords = await getCoordinates(breng);

            let bounds = [];

            if (haalCoords) {
                L.marker([haalCoords.lat, haalCoords.lon]).addTo(markersLayer)
                    .bindPopup("<b>Haaladres:</b> " + haal).openPopup();
                bounds.push([haalCoords.lat, haalCoords.lon]);
            } else {
                alert("Kon het haaladres niet vinden.");
            }

            if (brengCoords) {
                L.marker([brengCoords.lat, brengCoords.lon]).addTo(markersLayer)
                    .bindPopup("<b>Brengadres:</b> " + breng);
                bounds.push([brengCoords.lat, brengCoords.lon]);
            } else {
                alert("Kon het brengadres niet vinden.");
            }

            // Huidige GPS-locatie ook op de kaart tonen als extra marker
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let userLat = position.coords.latitude;
                    let userLon = position.coords.longitude;

                    L.marker([userLat, userLon]).addTo(markersLayer)
                        .bindPopup("<b>Jij bent hier</b>");
                    
                    bounds.push([userLat, userLon]);

                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                    statusEl.textContent = "Kaart bijgewerkt!";
                }, function() {
                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                    statusEl.textContent = "Kaart bijgewerkt!";
                });
            } else if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
                statusEl.textContent = "Kaart bijgewerkt!";
            }
        });
    </script>
</body>
</html>

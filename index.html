<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritten Tracker</title>
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: 15px; margin-top: 5px; }
        .status {
            font-size: 1rem;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
            background: #1e1e1e;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #map {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }
        #btnStart { background-color: #2ecc71; color: white; }
        #btnStop { background-color: #e74c3c; color: white; display: none; }
        
        .toggle-container {
            margin-bottom: 15px;
            background: #1e1e1e;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 55px;
            height: 30px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3498db;
            transition: .4s;
            border-radius: 30px;
        }
        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #9b59b6; }
        input:checked + .slider:before { transform: translateX(25px); }
        
        #log {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #aaa;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            border: 1px solid #222;
        }
        <link rel="manifest" href="manifest.json">

    </style>
</head>
<body>

<div class="container">
    <h1>Ritten Tracker</h1>
    
    <div class="status" id="statusText">Status: Klaar om te starten</div>

    <div id="map"></div>

    <div class="toggle-container">
        <span id="tripTypeLabel" style="font-size: 1.1rem; font-weight: bold;">Zakelijk</span>
        <label class="switch">
            <input type="checkbox" id="tripToggle" onclick="toggleTripType()">
            <span class="slider"></span>
        </label>
    </div>

    <button id="btnStart" onclick="startRide()">Start Rit</button>
    <button id="btnStop" onclick="stopRide()">Stop Rit</button>

    <div id="log">Geen actieve rit.</div>
</div>

<audio id="silentAudio" loop style="display:none;">
    <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<!-- Leaflet JS voor de kaart -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCkIvdmyFFLxnaB0I3X1zN3cART9n-kfcOjs-YpOnnzU1nYwKrFHUsmaRDyOFc6d2_/exec";

    let watchId = null;
    let map = null;
    let routePolyline = null;
    let currentMarker = null;
    let routeCoords = [];
    let wakeLock = null;

    let tripData = {
        type: "Zakelijk",
        startTime: null,
        startAddress: "Bezig met ophalen...",
        endAddress: "Bezig met ophalen..."
    };

    // Initialiseer de Leaflet Kaart met gratis OpenStreetMap
    function initMap() {
        map = L.map('map').setView([52.3676, 4.9041], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        routePolyline = L.polyline([], { color: '#e74c3c', weight: 5 }).addTo(map);
    }

    window.onload = initMap;

    function toggleTripType() {
        const isPrivate = document.getElementById('tripToggle').checked;
        tripData.type = isPrivate ? "Privé" : "Zakelijk";
        document.getElementById('tripTypeLabel').innerText = tripData.type;
    }

    // Reverse Geocoding via OpenStreetMap Nominatim
    async function getAddressFromLatLon(lat, lon) {
        try {
            let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            let data = await response.json();
            if (data && data.address) {
                let street = data.address.road || data.address.pedestrian || data.address.suburb || "Onbekende straat";
                let houseNumber = data.address.house_number || "";
                let city = data.address.city || data.address.town || data.address.village || "";
                return `${street} ${houseNumber}, ${city}`.trim();
            }
        } catch (e) {
            console.log("Fout bij ophalen adres:", e);
        }
        return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log("WakeLock fout:", err);
        }
    }

    function startRide() {
        if (!navigator.geolocation) {
            alert("Jouw browser ondersteunt geen GPS.");
            return;
        }

        // Keep-awake trucs
        const audio = document.getElementById('silentAudio');
        audio.play().catch(e => console.log("Audio autoplay geblokkeerd:", e));
        requestWakeLock();

        // Reset kaart & data
        routeCoords = [];
        routePolyline.setLatLngs([]);
        if (currentMarker) map.removeLayer(currentMarker);

        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';
        document.getElementById('statusText').innerText = `Status: Rit gestart (${tripData.type})...`;
        
        tripData.startTime = new Date();

        // Startlocatie bepalen
        navigator.geolocation.getCurrentPosition(async position => {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            
            tripData.startAddress = await getAddressFromLatLon(lat, lon);
            document.getElementById('statusText').innerText = `Vertrek: ${tripData.startAddress}`;

            let latLng = [lat, lon];
            routeCoords.push(latLng);
            map.setView(latLng, 16);
            
            // Groene marker voor de startlocatie
            L.circleMarker(latLng, { color: '#2ecc71', radius: 8, fillOpacity: 1 }).addTo(map);
        });

        // Live GPS Tracking
        watchId = navigator.geolocation.watchPosition(
            async position => {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let latLng = [lat, lon];

                routeCoords.push(latLng);
                routePolyline.setLatLngs(routeCoords);
                map.panTo(latLng);

                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.circleMarker(latLng, { color: '#e74c3c', radius: 6, fillOpacity: 0.9 }).addTo(map);

                let timeStr = new Date().toLocaleTimeString('nl-NL');
                let logMsg = `[${timeStr}] GPS punt vastgelegd<br>`;
                document.getElementById('log').innerHTML = logMsg + document.getElementById('log').innerHTML;
            },
            error => {
                console.log("GPS Fout:", error.message);
            },
            { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
    }

    async function stopRide() {
        // Stop keep-awake
        const audio = document.getElementById('silentAudio');
        audio.pause();
        if (wakeLock) { wakeLock.release(); wakeLock = null; }

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        document.getElementById('statusText').innerText = "Eindadres bepalen en verzenden...";

        // Pak allerlaatste positie
        const endPos = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(resolve, () => resolve(null), { enableHighAccuracy: true });
        });

        if (endPos) {
            tripData.endAddress = await getAddressFromLatLon(endPos.coords.latitude, endPos.coords.longitude);
        } else if (routeCoords.length > 0) {
            let lastCoord = routeCoords[routeCoords.length - 1];
            tripData.endAddress = await getAddressFromLatLon(lastCoord[0], lastCoord[1]);
        }

        let endTime = new Date();
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';

        // Genereer een Google Maps Route Link voor in je sheet
        let startCoord = routeCoords[0] || [0,0];
        let endCoord = routeCoords[routeCoords.length - 1] || [0,0];
        let mapUrl = `https://www.google.com/maps/dir/${startCoord[0]},${startCoord[1]}/${endCoord[0]},${endCoord[1]}`;

        const ritPayload = {
            datum: new Date().toLocaleDateString('nl-NL'),
            type: tripData.type,
            startTijd: tripData.startTime ? tripData.startTime.toLocaleTimeString('nl-NL') : "-",
            eindTijd: endTime.toLocaleTimeString('nl-NL'),
            startGps: tripData.startAddress,
            eindGps: tripData.endAddress,
            kaartLink: mapUrl
        };

        // Verstuur naar Google Sheet
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ritPayload)
        })
        .then(() => {
            document.getElementById('statusText').innerText = "Status: Opgeslagen in Google Sheet!";
            let summary = `<b>Opgeslagen (${ritPayload.type}):</b><br>Van: ${ritPayload.startGps}<br>Naar: ${ritPayload.eindGps}<br><br>` + document.getElementById('log').innerHTML;
            document.getElementById('log').innerHTML = summary;
        })
        .catch(err => {
            alert("Fout bij opslaan: " + err);
            document.getElementById('statusText').innerText = "Fout bij opslaan!";
        });
    }
</script>

</body>
</html>

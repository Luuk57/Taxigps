<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritten Tracker met Adressen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        .status {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #1e1e1e;
        }
        button {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #btnStart { background-color: #2ecc71; color: white; }
        #btnStop { background-color: #e74c3c; color: white; display: none; }
        
        .toggle-container {
            margin: 20px 0;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3498db;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #9b59b6; }
        input:checked + .slider:before { transform: translateX(26px); }
        
        #log {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #aaa;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ritten Tracker (Adressen)</h1>
    
    <div class="status" id="statusText">Status: Klaar om te starten</div>

    <div class="toggle-container">
        <span id="tripTypeLabel" style="font-size: 1.1rem; font-weight: bold;">Zakelijk</span>
        <label class="switch">
            <input type="checkbox" id="tripToggle" onclick="toggleTripType()">
            <span class="slider"></span>
        </label>
    </div>

    <button id="btnStart" onclick="startRide()">Start Rit</button>
    <button id="btnStop" onclick="stopRide()">Stop Rit</button>

    <div id="log">Geen actieve rit.</div>
</div>

<audio id="silentAudio" loop style="display:none;">
    <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCkIvdmyFFLxnaB0I3X1zN3cART9n-kfcOjs-YpOnnzU1nYwKrFHUsmaRDyOFc6d2_/exec";

    let watchId = null;
    let tripData = {
        type: "Zakelijk",
        startTime: null,
        startAddress: "Bezig met ophalen...",
        endAddress: "Bezig met ophalen..."
    };

    function toggleTripType() {
        const isPrivate = document.getElementById('tripToggle').checked;
        tripData.type = isPrivate ? "Privé" : "Zakelijk";
        document.getElementById('tripTypeLabel').innerText = tripData.type;
    }

    // Functie om coördinaten om te zetten naar een straatnaam
    async function getAddressFromLatLon(lat, lon) {
        try {
            let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            let data = await response.json();
            if (data && data.address) {
                let street = data.address.road || data.address.pedestrian || data.address.suburb || "Onbekende straat";
                let houseNumber = data.address.house_number || "";
                let city = data.address.city || data.address.town || data.address.village || "";
                return `${street} ${houseNumber}, ${city}`.trim();
            }
        } catch (e) {
            console.log("Fout bij ophalen adres:", e);
        }
        return `${lat.toFixed(4)}, ${lon.toFixed(4)}`; // Fallback op coördinaten als het misgaat
    }

    function startRide() {
        if (!navigator.geolocation) {
            alert("Jouw browser ondersteunt geen GPS.");
            return;
        }

        const audio = document.getElementById('silentAudio');
        audio.play().catch(e => console.log("Audio autoplay geblokkeerd:", e));

        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';
        document.getElementById('statusText').innerText = `Status: Rit gestart (${tripData.type}). Adres bepalen...`;
        
        tripData.startTime = new Date();

        // Pak direct het startadres
        navigator.geolocation.getCurrentPosition(async position => {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            tripData.startAddress = await getAddressFromLatLon(lat, lon);
            document.getElementById('statusText').innerText = `Status: Vertrek: ${tripData.startAddress}`;
        });

        // Volg route live
        watchId = navigator.geolocation.watchPosition(
            async position => {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                
                // Vertaal het meest recente punt ook direct naar een adres voor de log
                let currentAddress = await getAddressFromLatLon(lat, lon);
                tripData.endAddress = currentAddress;

                let timeStr = new Date().toLocaleTimeString('nl-NL');
                let logMsg = `[${timeStr}] ${currentAddress}<br>`;
                document.getElementById('log').innerHTML = logMsg + document.getElementById('log').innerHTML;
            },
            error => {
                alert("GPS Fout: " + error.message);
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
    }

    async function stopRide() {
        const audio = document.getElementById('silentAudio');
        audio.pause();

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        document.getElementById('statusText').innerText = "Adres controleren en versturen...";

        // Pak het allerlaatste eindpunt en zet om naar adres
        const endPos = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(resolve, () => resolve(null), { enableHighAccuracy: true });
        });

        if (endPos) {
            tripData.endAddress = await getAddressFromLatLon(endPos.coords.latitude, endPos.coords.longitude);
        }

        let endTime = new Date();
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';

        const ritPayload = {
            datum: new Date().toLocaleDateString('nl-NL'),
            type: tripData.type,
            startTijd: tripData.startTime ? tripData.startTime.toLocaleTimeString('nl-NL') : "-",
            eindTijd: endTime.toLocaleTimeString('nl-NL'),
            startGps: tripData.startAddress, // Nu het echte adres i.p.v. getallen!
            eindGps: tripData.endAddress   // Nu het echte adres i.p.v. getallen!
        };

        // Verstuur data naar Google Sheet
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ritPayload)
        })
        .then(() => {
            document.getElementById('statusText').innerText = "Status: Opgeslagen met adressen!";
            let summary = `<b>Opgeslagen (${ritPayload.type}):</b><br>Van: ${ritPayload.startGps}<br>Naar: ${ritPayload.eindGps}<br><br>` + document.getElementById('log').innerHTML;
            document.getElementById('log').innerHTML = summary;
        })
        .catch(err => {
            alert("Fout bij opslaan: " + err);
            document.getElementById('statusText').innerText = "Fout bij opslaan!";
        });
    }
</script>

</body>
</html>

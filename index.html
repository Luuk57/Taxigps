<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vervoer App - Haal & Breng</title>
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f9;
        }
        #form-container {
            padding: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
            }
        #map {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="form-container">
        <h2>Vervoer Opdracht</h2>
        <div class="input-group">
            <label for="haalAdres">Haaladres:</label>
            <input type="text" id="haalAdres" placeholder="Bijv. Dorpsstraat 1, Amsterdam" value="Amsterdam Centraal">
        </div>
        <div class="input-group">
            <label for="brengAdres">Brengadres:</label>
            <input type="text" id="brengAdres" placeholder="Bijv. Kerkstraat 5, Utrecht" value="Utrecht Centraal">
        </div>
        <button id="startBtn">Start Rit & Toon Kaart</button>
    </div>

    <!-- De Kaart -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialiseer de kaart (standaard op Nederland gericht)
        let map = L.map('map').setView([52.1326, 5.2913], 8);

        // Voeg OpenStreetMap tegels toe
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // Functie om coördinaten op te zoeken via Nominatim (OpenStreetMap geocoding)
        async function getCoordinates(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon)
                    };
                }
                return null;
            } catch (error) {
                console.error("Fout bij ophalen adres:", error);
                return null;
            }
        }

        // Knop logica
        document.getElementById('startBtn').addEventListener('click', async function() {
            const haal = document.getElementById('haalAdres').value;
            const breng = document.getElementById('brengAdres').value;

            if (!haal || !breng) {
                alert("Vul alstublieft zowel het haal- als brengadres in.");
                return;
            }

            // Wis oude markers
            markersLayer.clearLayers();

            // Haal coördinaten op voor beide adressen
            alert("Adressen worden gezocht...");
            const haalCoords = await getCoordinates(haal);
            const brengCoords = await getCoordinates(breng);

            let bounds = [];

            if (haalCoords) {
                let haalMarker = L.marker([haalCoords.lat, haalCoords.lon]).addTo(markersLayer)
                    .bindPopup("<b>Haaladres:</b> " + haal).openPopup();
                bounds.push([haalCoords.lat, haalCoords.lon]);
            } else {
                alert("Kon het haaladres niet vinden.");
            }

            if (brengCoords) {
                let brengMarker = L.marker([brengCoords.lat, brengCoords.lon]).addTo(markersLayer)
                    .bindPopup("<b>Brengadres:</b> " + breng);
                bounds.push([brengCoords.lat, brengCoords.lon]);
            } else {
                alert("Kon het brengadres niet vinden.");
            }

            // Probeer ook de huidige locatie van de gebruiker op te halen
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let userLat = position.coords.latitude;
                    let userLon = position.coords.longitude;
                    
                    // Voeg marker toe voor huidige locatie
                    let userIcon = L.divIcon({className: 'user-marker', html: '📍'});
                    L.marker([userLat, userLon], {icon: userIcon}).addTo(markersLayer)
                        .bindPopup("<b>Jij bent hier (Huidige locatie)</b>");
                    
                    bounds.push([userLat, userLon]);
                    
                    // Zoom de kaart zodat alles zichtbaar is
                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                }, function(error) {
                    console.log("Locatiebewerking geweigerd of mislukt:", error.message);
                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                });
            } else if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        });
    </script>
</body>
</html>
